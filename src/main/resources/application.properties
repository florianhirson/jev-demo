spring.application.name=jev-demo

# Exposes /actuator/health and /actuator/prometheus (scraped metrics from TriageMetrics).
# Boot 4 disables metrics export by default (management.defaults.metrics.export.enabled=false),
# so the prometheus exporter needs its own opt-in on top of the endpoint exposure below.
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true
