# Test-only dummy value so the Spring context can boot without a real secret.
# No test in the default build makes a real call to jev with this key — see
# the "live" JUnit tag for the one that does, which requires the real
# JEV_API_KEY and is excluded from ./gradlew test by default.
JEV_API_KEY=test-dummy-key-not-a-real-secret

# src/test/resources/application.properties shadows src/main/resources/application.properties
# entirely on the test classpath (Spring loads the first classpath:application.properties it
# finds, it doesn't merge same-named files) — so main's management.* properties have to be
# repeated here for TriageObservabilityIntegrationTest to see /actuator/prometheus.
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true
