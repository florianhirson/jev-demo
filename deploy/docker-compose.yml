# Optional, demo-only: Prometheus scrapes the running app's
# /actuator/prometheus (start it separately with ./gradlew bootRun — this
# compose file doesn't build or run the app itself), Grafana lets you
# explore triage.routed / triage.failed. Not part of any deployment; local
# exploration only.
#
#   cd deploy && docker compose up
#   open http://localhost:9090        # Prometheus
#   open http://localhost:3000        # Grafana (anonymous viewer, see below)
#
# Ports are bound to loopback only (127.0.0.1) - this stack has no auth of
# its own, so it must not be reachable from the LAN even though it's "just a
# demo".
services:
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous *viewer* access, not admin: the stated purpose is only to
      # explore the demo's Prometheus metrics, which Viewer already covers.
      # Admin would let an unauthenticated visitor manage data sources -
      # including pointing Grafana's data-source proxy at an arbitrary URL
      # reachable from the container (this compose file already wires up
      # host.docker.internal) - a small SSRF pivot, not a secrets question,
      # so granting it wouldn't have been justified by "no real secret here"
      # even before the loopback binding above.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus
