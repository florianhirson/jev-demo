# Optional, demo-only: Prometheus scrapes the running app's
# /actuator/prometheus (start it separately with ./gradlew bootRun — this
# compose file doesn't build or run the app itself), Grafana lets you
# explore triage.routed / triage.failed. Not part of any deployment; local
# exploration only.
#
#   cd deploy && docker compose up
#   open http://localhost:9090        # Prometheus
#   open http://localhost:3000        # Grafana (anonymous viewer, see below)
#
# Ports are bound to loopback only (127.0.0.1) - this stack has no auth of
# its own, so it must not be reachable from the LAN even though it's "just a
# demo".
services:
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Provisions the Prometheus datasource and the triage dashboard from
      # files, read-only - nobody needs to manage a datasource at runtime
      # through the UI. On its own this does NOT stop a *new* datasource
      # being created by whoever is authenticated (see GF_AUTH_BASIC_ENABLED
      # below for what actually closes that) - it only means the shipped one
      # can't be repointed.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      # Anonymous *viewer* access: the stated purpose is only to explore the
      # demo's Prometheus metrics, which Viewer covers once the datasource
      # and dashboard above are provisioned rather than created by hand.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Grafana ships with a default admin/admin login. Hiding the login
      # form (below) only hides the UI - the credential still authenticates
      # over HTTP Basic Auth against the API, which is enough on its own to
      # create a new datasource pointed at an arbitrary URL (SSRF), even
      # with the provisioned one above locked read-only. Disabling basic
      # auth entirely closes that credential outright; anonymous viewing
      # doesn't depend on it, so nothing documented here needs it.
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on:
      - prometheus
