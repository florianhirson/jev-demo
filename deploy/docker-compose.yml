# Optional, demo-only: Prometheus scrapes the running app's
# /actuator/prometheus (start it separately with ./gradlew bootRun — this
# compose file doesn't build or run the app itself), Grafana lets you
# explore triage.routed / triage.failed. Not part of any deployment; local
# exploration only.
#
#   cd deploy && docker compose up
#   open http://localhost:9090        # Prometheus
#   open http://localhost:3000        # Grafana (anonymous admin, see below)
services:
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      # Anonymous admin access: this stack is optional, local-only tooling
      # for exploring the demo's Prometheus metrics and is never deployed
      # anywhere — there is no real secret to manage here (see CLAUDE.md's
      # devops.secret-management notes on increment 6).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on:
      - prometheus
