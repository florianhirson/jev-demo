# Optional, demo-only: Prometheus scrapes the running app's
# /actuator/prometheus (start it separately with ./gradlew bootRun — this
# compose file doesn't build or run the app itself), Grafana lets you
# explore triage.routed / triage.failed. Not part of any deployment; local
# exploration only.
#
#   cd deploy && docker compose up
#   open http://localhost:9090        # Prometheus
#   open http://localhost:3000        # Grafana (anonymous viewer, see below)
#
# Ports are bound to loopback only (127.0.0.1) - this stack has no auth of
# its own, so it must not be reachable from the LAN even though it's "just a
# demo".
services:
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Provisions the Prometheus datasource and the triage dashboard from
      # files, read-only - nobody, anonymous or not, needs to manage a
      # datasource at runtime, which is what actually removes the SSRF-shaped
      # risk (an Admin repointing the datasource proxy at an arbitrary URL),
      # not the Viewer/Admin role choice by itself.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      # Anonymous *viewer* access, not admin: the stated purpose is only to
      # explore the demo's Prometheus metrics, which Viewer already covers
      # once the datasource and dashboard above are provisioned rather than
      # created by hand.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Grafana ships with a default admin/admin login; loopback-only
      # publishing (above) isn't enough to rely on alone since any local
      # process or user reaches it too. Hiding the login form removes that
      # path entirely for a stack whose only purpose is anonymous viewing.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on:
      - prometheus
